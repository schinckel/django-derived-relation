[tox]
requires = tox>=4
env_list =
    py{310,311,312}-django{42,50}
    py{310,311,312,313}-django51
    py{310,311,312,313,314}-django52
    py{312,313,314}-django{60,61,main}

[testenv]
package = wheel
deps =
    psycopg[binary]>=3.2
    mysql: mysqlclient>=2.2
    oracle-django42: cx_Oracle>=8.3,<9
    oracle-!django42: oracledb>=2.3
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://github.com/django/django/archive/refs/heads/main.zip
pass_env =
    PG*
    MYSQL_*
    ORACLE_*
    LD_LIBRARY_PATH
commands =
    !mysql-!oracle: python tests/runtests.py
    !mysql-!oracle: python tests/runtests.py --sqlite
    mysql: python tests/runtests.py --mysql
    oracle: python tests/runtests.py --oracle
