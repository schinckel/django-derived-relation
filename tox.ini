[tox]
requires = tox>=4
env_list =
    py{310,311,312}-django{42,50}
    py{310,311,312,313}-django51
    py{310,311,312,313,314}-django52
    py{312,313,314}-django{60,61,main}

[testenv]
package = wheel
deps =
    !yugabyte: psycopg[binary]>=3.2
    yugabyte: psycopg2-binary>=2.9
    yugabyte: django-yugabytedb==4.2.0.1
    cockroach-django42: django-cockroachdb>=4.2,<4.3
    cockroach-django61: django-cockroachdb>=6.1,<6.2
    firebird-django52: django-firebird>=5.0,<5.1
    firebird-django61: django-firebird>=5.1,<5.2
    db2-django52: ibm-db-django==1.6.0.0
    # ibm-db-django 1.6 imports Jinja2 without declaring the dependency.
    db2-django52: Jinja2>=3.1
    tidb-django42: django-tidb>=4.2,<4.3
    tidb-django60: django-tidb>=6.0,<6.1
    {mysql,tidb}: mysqlclient>=2.2
    oracle-django42: cx_Oracle>=8.3,<9
    oracle-!django42: oracledb>=2.3
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
    djangomain: https://github.com/django/django/archive/refs/heads/main.zip
pass_env =
    PG*
    MYSQL_*
    ORACLE_*
    LD_LIBRARY_PATH
    FIREBIRD_*
    DB2_*
commands =
    !mysql-!oracle-!cockroach-!yugabyte-!firebird-!db2-!tidb: python tests/runtests.py
    !mysql-!oracle-!cockroach-!yugabyte-!firebird-!db2-!tidb: python tests/runtests.py --sqlite
    mysql: python tests/runtests.py --mysql
    oracle: python tests/runtests.py --oracle
    cockroach: python tests/runtests.py --cockroachdb
    yugabyte: python tests/runtests.py --yugabytedb
    firebird: python tests/runtests.py --firebird
    db2: python tests/runtests.py --db2
    tidb: python tests/runtests.py --tidb
