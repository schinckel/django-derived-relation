name: Tests
on: [push, pull_request, workflow_call]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        django: ["Django>=5.2,<5.3", "Django>=6.0,<6.1", "Django>=6.1,<6.2", "https://github.com/django/django/archive/refs/heads/main.zip"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e '.[test]'
      - run: python -m pip install '${{ matrix.django }}'
      - run: python tests/runtests.py
      - run: python tests/runtests.py --sqlite
      - run: python -m black --check .
      - run: python -m isort --check-only .
      - run: python -m flake8 .
