name: Tests
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  schedule:
    - cron: "17 3 * * 1"
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        django: ["42", "50", "51", "52", "60", "61", "main"]
        exclude:
          - {python: "3.13", django: "42"}
          - {python: "3.14", django: "42"}
          - {python: "3.13", django: "50"}
          - {python: "3.14", django: "50"}
          - {python: "3.14", django: "51"}
          - {python: "3.10", django: "60"}
          - {python: "3.10", django: "61"}
          - {python: "3.10", django: "main"}
          - {python: "3.11", django: "60"}
          - {python: "3.11", django: "61"}
          - {python: "3.11", django: "main"}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install tox
      - name: Test installed wheel against PostgreSQL and SQLite
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          DJANGO_VERSION: ${{ matrix.django }}
        run: python -m tox -e "py${PYTHON_VERSION/./}-django${DJANGO_VERSION}"
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install black isort flake8 sphinx-lint build twine
      - run: python -m black --check .
      - run: python -m isort --check-only .
      - run: python -m flake8 .
      - run: python -m sphinxlint README.rst CHANGES.rst
      - run: python -m unittest discover -s tests -p test_release.py
      - run: python -m build
      - run: python -m twine check --strict dist/*
